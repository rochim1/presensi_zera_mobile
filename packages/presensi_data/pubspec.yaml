name: presensi_data
description: A new Flutter package project.
version: 0.0.1
publish_to: none

environment:
  sdk: "^3.11.1"

dependencies:
  # package local
  presensi_domain:
    path: ../presensi_domain

  # check connectivity
  connectivity_plus: ^7.1.0
  # rest api
  dio: ^5.9.2
  # local preference
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # logger rest api
  pretty_dio_logger: ^1.4.0
  # dependencies injection
  get_it: ^9.2.1
  # equality comparisons
  dartz: ^0.10.1
  equatable: ^2.0.8
  # graphql
  graphql_flutter: ^5.3.0
  json_annotation: ^4.11.0
  http: ^1.6.0
  logger: ^2.7.0
  firebase_core: ^4.6.0
  auto_mappr_annotation: ^2.3.0
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  chucker_flutter: ^1.9.1
  web_socket_channel: ^3.0.3
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  hive_generator_io: ^3.2.2
  graphql_codegen: ^3.0.1
  json_serializable: ^6.13.0
  auto_mappr: ^2.14.0
  freezed: ^3.2.5

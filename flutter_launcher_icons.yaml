# For this script please execute this command below
# `f pub run flutter_launcher_icons:main -f flutter_launcher_icons.yaml`

flutter_icons:
  android: true
  min_sdk_android: 21
  ios: false
  image_path: "assets/icons/launcher/icon.png"
  adaptive_icon_background: "assets/icons/launcher/background.png"
  adaptive_icon_foreground: "assets/icons/launcher/foreground.png"

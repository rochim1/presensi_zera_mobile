name: presensi_mobile
description: Presensi Mobile is an innovative mobile application specifically designed to streamline the daily attendance process for pharmacy employees.
publish_to: "none"

# When you rebuild the app for Android, any updates in the version number
# from the pubspec file will update the `versionName` and `versionCode`
# in the `local.properties` file.
version: 2.0.0+38

environment:
  sdk: "^3.11.1"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # local packages
  presensi_domain:
    path: packages/presensi_domain/
  presensi_data:
    path: packages/presensi_data/

  cupertino_icons: ^1.0.9
  # state management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  # internationalization & localization
  intl: ^0.20.2
  timezone: ^0.11.0
  # equality comparasion
  equatable: ^2.0.8
  # functional programming
  dartz: ^0.10.1
  # version control
  package_info_plus: ^9.0.1
  # route management
  auto_route: ^11.1.0
  # local preference
  hive_flutter: ^1.1.0
  # check permission
  permission_handler: ^12.0.1
  # check connectivity
  connectivity_plus: ^7.1.0
  # logger for development
  logger: ^2.7.0
  # management image/camera/file
  image_cropper: ^12.1.1
  image_picker: ^1.2.1
  camera: ^0.12.0+1
  mobile_scanner: ^7.1.4
  file_picker: ^10.3.10
  # google map
  geocoding: ^4.0.0
  google_maps_flutter: ^2.17.0
  location: ^10.0.2
  # ui packages
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_dotenv: ^6.0.0
  pull_to_refresh: ^2.0.0
  fluttertoast: ^10.0.0
  flutter_smart_dialog: ^5.1.0
  flutter_spinkit: ^5.2.2
  get_it: ^9.2.1
  photo_view: ^0.15.0
  responsive_framework: ^1.5.1
  action_slider: ^0.7.0
  flutter_svg: ^2.2.4
  modal_bottom_sheet: ^3.0.0
  group_radio_button: ^1.3.0
  dropdown_search: ^6.0.2
  we_slide: ^2.4.0
  path_provider: ^2.1.5
  http: ^1.6.0
  flutter_pdfview: ^1.4.4
  url_launcher: ^6.3.2
  device_info_plus: ^12.4.0
  textfield_tags: ^3.0.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0
  firebase_crashlytics: ^5.1.0
  # 5.x has migrated to Built-in Kotlin and requires Flutter 3.47+/AGP 9.
  # Keep the latest KGP-compatible release until the Flutter toolchain moves.
  in_app_update: ^4.2.5
  firebase_analytics: ^12.2.0
  google_maps_flutter_android: ^2.19.5
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_commons: ^0.11.1
  firebase_remote_config: ^6.3.0
  collection: ^1.19.1
  flutter_sticky_header: ^0.8.0
  flutter_inappwebview: ^6.1.5
  web_socket_channel: ^3.0.3
  freezed_annotation: ^3.1.0
  formz: ^0.8.0
  phosphoricons_flutter: ^1.0.0
  flutter_screenutil: ^5.9.3
  board_datetime_picker: ^2.8.5
  chucker_flutter: ^1.9.1
  flutter_image_compress: ^2.4.0
  dio: ^5.9.2
  table_calendar: ^3.2.0
  qr_flutter: ^4.1.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  markdown: ^7.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.13.1
  auto_route_generator: ^10.5.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^3.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/launcher/
    - assets/common/
    - .env.development
    - .env.production

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
